spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/posterpro
    username: posterpro
    password: posterpro_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: cG9zdGVycHJvLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLXBvc3RlcnBybw==
  expiration: 86400000

storage:
  s3:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: posterpro
    region: us-east-1

payment:
  active-provider: razorpay
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret_32chars_min}
