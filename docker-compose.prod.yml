# Self-hosted production stack: Postgres + MinIO + the backend, on one Docker
# host. Skip this entirely if you're using a managed Postgres (Supabase/RDS/
# Railway Postgres) and/or managed S3-compatible storage (AWS S3/R2/managed
# MinIO) instead — point application-prod.yml's env vars at those and deploy
# just the backend image (see Dockerfile) to Railway/Render/Fly instead.
#
# Usage:
#   cp .env.prod.example .env.prod   # fill in real values, never commit .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: posterpro-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-posterpro}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: published to the host by default — only `backend` reaches it,
    # over the compose network. Uncomment to allow host-machine psql access:
    # ports:
    #   - "127.0.0.1:5432:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      # Must stay published (not internal-only) if `storage.s3.public-base-url`
      # points at this host directly rather than through a reverse proxy/CDN.
      - "9000:9000"
      - "9001:9001" # MinIO web console — put behind auth/VPN or remove in real prod
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-posterpro}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_PUBLIC_BASE_URL: ${STORAGE_S3_PUBLIC_BASE_URL}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-posterpro}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      PLAN_PRICE_BASIC: ${PLAN_PRICE_BASIC}
      PLAN_PRICE_PREMIUM: ${PLAN_PRICE_PREMIUM}
      PLAN_PRICE_ENTERPRISE: ${PLAN_PRICE_ENTERPRISE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
